<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }
    /* Картина занимает весь экран */
    #art-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      z-index: 1;
      background-color: #ffffff;
    }
    /* Ненавязчивая плашка в нижнем углу */
    #overlay-card {
      position: absolute;
      bottom: 12px;
      right: 12px;
      max-width: 42%;
      background: rgba(255, 255, 255, 0.92);
      color: #000000;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      z-index: 10;
      border: 1px solid #ddd;
    }
    #title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 2px;
    }
    #artist {
      font-size: 13px;
      font-weight: 600;
      color: #222;
      margin-bottom: 2px;
    }
    #details {
      font-size: 11px;
      color: #555;
      margin-bottom: 4px;
    }
    #description {
      font-size: 11px;
      line-height: 1.25;
      color: #222;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      color: #888;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div id="loader">Загрузка шедевра...</div>
  <img id="art-image" alt="Картина" />

  <div id="overlay-card" style="display: none;">
    <div id="title"></div>
    <div id="artist"></div>
    <div id="details"></div>
    <div id="description"></div>
  </div>

  <script>
    async function loadArt() {
      const page = Math.floor(Math.random() * 80) + 1;
      const apiUrl = `https://api.artic.edu/api/v1/artworks?page=${page}&limit=12&fields=id,title,artist_display,date_display,medium_display,image_id,thumbnail,short_description,description`;

      try {
        const resp = await fetch(apiUrl);
        const data = await resp.json();
        const items = (data.data || []).filter(i => i.image_id);

        if (!items.length) throw new Error('No items');
        const art = items[Math.floor(Math.random() * items.length)];

        document.getElementById('title').textContent = art.title || 'Картина';
        document.getElementById('artist').textContent = art.artist_display || 'Неизвестный мастер';
        document.getElementById('details').textContent = [art.date_display, art.medium_display].filter(Boolean).join(' • ');

        let rawDesc = art.short_description || art.description || (art.thumbnail ? art.thumbnail.alt_text : '') || '';
        const tmp = document.createElement('div');
        tmp.innerHTML = rawDesc;
        const cleanDesc = (tmp.textContent || tmp.innerText || '').trim();
        
        const descEl = document.getElementById('description');
        if (cleanDesc) {
          descEl.textContent = cleanDesc;
          descEl.style.display = '-webkit-box';
        } else {
          descEl.style.display = 'none';
        }

        const img = document.getElementById('art-image');
        // Используем базовый CDN URL Чикаго, который возвращает картинку надежно
        img.onload = () => {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('overlay-card').style.display = 'block';
        };
        img.onerror = () => {
          // Запасной fallback на надежный Wikimedia URL при сбое CDN
          img.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/800px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg';
          document.getElementById('title').textContent = 'Звёздная ночь';
          document.getElementById('artist').textContent = 'Винсент ван Гог';
          document.getElementById('details').textContent = '1889';
          document.getElementById('overlay-card').style.display = 'block';
        };

        // Загрузка оптимизированного под 800px изображения
        img.src = `https://www.artic.edu/iiif/2/${art.image_id}/full/843,/0/default.jpg`;

      } catch (e) {
        const img = document.getElementById('art-image');
        img.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Caspar_David_Friedrich_-_Wanderer_%C3%BCber_dem_Nebelmeer.jpg/800px-Caspar_David_Friedrich_-_Wanderer_%C3%BCber_dem_Nebelmeer.jpg';
        document.getElementById('title').textContent = 'Странник над морем тумана';
        document.getElementById('artist').textContent = 'Каспар Давид Фридрих';
        document.getElementById('details').textContent = '1818';
        document.getElementById('overlay-card').style.display = 'block';
      }
    }

    loadArt();
  </script>
</body>
</html>
