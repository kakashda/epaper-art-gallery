<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    /* Картинка любого размера всегда помещается на экран целиком:
       object-fit: contain сохраняет пропорции, max-width/height не дают
       ей вылезти за пределы окна независимо от её геометрии. */
    #art {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="art" src="current.jpg?v=1788484502" alt="Artwork">

  <script>
    // Простое и надёжное автообновление (работает на мобильном Chrome):
    // каждые 30 сек читаем last_update.txt; как только его содержимое
    // изменилось (значит GitHub Actions выложил новую картину) — делаем
    // ПОЛНУЮ перезагрузку страницы (location.reload). Полная перезагрузка
    // надёжнее подмены src: мобильные браузеры гарантированно берут свежие
    // current.jpg и index.html, без хитростей с кэшем.
    //
    // Дополнительно проверяем СРАЗУ при возврате на вкладку/в приложение
    // (visibilitychange, focus, pageshow), т.к. в фоне таймер «замораживается».
    (function () {
      var img = document.getElementById('art');
      var CHECK_INTERVAL_MS = 30 * 1000; // как часто проверять last_update.txt

      // Текущая известная версия = то, с чем страница была сгенерирована.
      var lastSeen = (function () {
        var m = /[?&]v=(\d+)/.exec(img.getAttribute('src') || '');
        return m ? m[1] : null;
      })();

      async function checkForUpdate() {
        try {
          // Уникальный URL (timestamp + случайное число) гарантированно тянет
          // свежий last_update.txt, минуя кэш мобильных браузеров/прокси.
          var bust = Date.now() + '-' + Math.random().toString(36).slice(2);
          var res = await fetch('last_update.txt?_=' + bust, { cache: 'no-store' });
          if (!res.ok) return;
          var version = (await res.text()).trim();
          if (!version) return;

          if (lastSeen === null) {
            // Первый успешный опрос — просто запоминаем текущую версию.
            lastSeen = version;
            return;
          }
          if (version !== lastSeen) {
            // Появилась новая картина — полная перезагрузка страницы.
            location.reload();
          }
        } catch (e) {
          // Сеть недоступна / файл не отдался — молча ждём следующей проверки.
        }
      }

      // Периодическая проверка (работает, пока вкладка активна).
      setInterval(checkForUpdate, CHECK_INTERVAL_MS);

      // Возврат на вкладку (Page Visibility API): проверяем немедленно.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          checkForUpdate();
        }
      });

      // Окно получило фокус (переключение приложений/вкладок на мобильном).
      window.addEventListener('focus', checkForUpdate);

      // Возврат из bfcache (кнопка «назад»/восстановление вкладки в мобильном
      // Chrome часто отдаёт страницу из кэша без повторного запуска таймера).
      window.addEventListener('pageshow', checkForUpdate);
    })();
  </script>
</body>
</html>
