<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Museum Artwork</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    #container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      padding: 12px;
      gap: 16px;
    }
    #image-box {
      flex: 1 1 55%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdfdfd;
    }
    #art-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #info-box {
      flex: 1 1 45%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6px 10px;
      overflow: hidden;
    }
    #title {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 8px;
      color: #000;
    }
    #artist {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #222;
    }
    #details {
      font-size: 13px;
      color: #555;
      margin-bottom: 12px;
    }
    #description {
      font-size: 13px;
      line-height: 1.4;
      color: #111;
      display: -webkit-box;
      -webkit-line-clamp: 8;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="image-box">
      <img id="art-image" src="" alt="Изображение картины">
    </div>
    <div id="info-box">
      <div id="title">Загрузка шедевра...</div>
      <div id="artist">Поиск в каталоге музея</div>
      <div id="details"></div>
      <div id="description"></div>
    </div>
  </div>

  <script>
    async function loadRandomArtwork() {
      const titleEl = document.getElementById('title');
      const artistEl = document.getElementById('artist');
      const detailsEl = document.getElementById('details');
      const descEl = document.getElementById('description');
      const imgEl = document.getElementById('art-image');

      // 100 страниц по 15 шедевров = 1500+ картин в ротации
      const randomPage = Math.floor(Math.random() * 95) + 1;
      const url = `https://api.artic.edu/api/v1/artworks?page=${randomPage}&limit=15&fields=id,title,artist_display,date_display,medium_display,image_id,thumbnail,short_description,description`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);

        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        
        if (!res.ok) throw new Error('Network error');
        const json = await res.json();
        
        const validItems = (json.data || []).filter(item => item.image_id);
        if (!validItems.length) throw new Error('No items with image');

        const item = validItems[Math.floor(Math.random() * validItems.length)];
        
        titleEl.textContent = item.title || 'Картина';
        artistEl.textContent = item.artist_display || 'Неизвестный мастер';
        
        const meta = [item.date_display, item.medium_display].filter(Boolean);
        detailsEl.textContent = meta.join(' • ');

        let rawText = item.short_description || item.description || (item.thumbnail ? item.thumbnail.alt_text : '') || 'Экспонат из коллекции Чикагского института искусств.';
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawText, 'text/html');
        descEl.textContent = doc.body.textContent || doc.body.innerText || '';

        // IIIF сервис масштабирования изображения до 450px по ширине для ePaper
        imgEl.src = `https://www.artic.edu/iiif/2/${item.image_id}/full/450,/default.jpg`;
      } catch (err) {
        // Запасной fallback на случай сбоя сети
        titleEl.textContent = 'Звёздная ночь';
        artistEl.textContent = 'Винсент ван Гог';
        detailsEl.textContent = '1889 • Холст, масло';
        descEl.textContent = 'Шедевр постимпрессионизма. Знаменитый пейзаж с вихрями ночного неба, написанный в Сен-Реми-де-Прованс.';
        imgEl.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/480px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg';
      }
    }

    loadRandomArtwork();
  </script>
</body>
</html>
