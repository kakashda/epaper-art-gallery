<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Запрет кеширования — браузер ВСЕГДА загружает свежую версию -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Страница сама перезагружается каждые 2 минуты, чтобы дисплей подхватывал свежую картину. -->
  <meta http-equiv="refresh" content="120">
  <title>Art Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    img {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="artwork" alt="Artwork">
  <script>
    // Добавляем timestamp к URL изображения, чтобы браузер НЕ использовал кеш
    document.getElementById('artwork').src = 'current.jpg?t=' + Date.now();
  </script>
</body>
</html>
